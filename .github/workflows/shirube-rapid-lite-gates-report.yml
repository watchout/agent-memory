name: Shirube Rapid/Lite Gates Report

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write

concurrency:
  group: shirube-rapid-lite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  RESULT_DIR_NAME: shirube-rapid-lite-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  shirube-rapid-lite-gates-report:
    name: Shirube Rapid/Lite Gates Report
    runs-on: ubuntu-latest
    steps:
      - name: Prepare trusted result directory
        shell: bash
        run: |
          set -euo pipefail
          runner_temp_real="$(realpath "$RUNNER_TEMP")"
          result_candidate="$RUNNER_TEMP/$RESULT_DIR_NAME"
          result_parent_real="$(realpath "$(dirname "$result_candidate")")"
          result_name="$(basename "$result_candidate")"
          if [[ "$result_parent_real" != "$runner_temp_real" || -z "$result_name" || "$result_name" == "." || "$result_name" == ".." ]]; then
            echo "EVALUATOR_UNAVAILABLE: result path is outside the runner-owned temporary directory" >&2
            exit 2
          fi
          if [[ -e "$result_candidate" || -L "$result_candidate" ]]; then
            echo "EVALUATOR_UNAVAILABLE: trusted result path was pre-seeded" >&2
            exit 2
          fi
          mkdir -m 0700 "$result_candidate"
          result_real="$(realpath "$result_candidate")"
          if [[ -L "$result_candidate" || "$result_real" != "$result_parent_real/$result_name" ]]; then
            echo "EVALUATOR_UNAVAILABLE: trusted result path failed containment validation" >&2
            exit 2
          fi
          echo "RESULT_DIR=$result_real" >> "$GITHUB_ENV"

      - name: Checkout target head as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted base runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          sparse-checkout: .shirube/runtime/rapid-lite
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify trusted runtime bundle
        run: |
          node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const root = "trusted/.shirube/runtime/rapid-lite";
          try {
            const manifest = JSON.parse(fs.readFileSync(path.join(root, "manifest.json"), "utf8"));
            const entries = Object.entries(manifest.files || {});
            if (manifest.schema_version !== "shirube-runtime-manifest/v1" || entries.length === 0) {
              throw new Error("runtime manifest schema or inventory is invalid");
            }
            for (const [file, expected] of entries) {
              if (typeof expected !== "string" || !/^[a-f0-9]{64}$/.test(expected)) {
                throw new Error(`invalid digest: ${file}`);
              }
              if (!file || file === "manifest.json" || file.includes("\\") || path.posix.isAbsolute(file) || path.posix.normalize(file) !== file || file.split("/").some((part) => !part || part === "." || part === "..")) {
                throw new Error(`unsafe runtime path: ${file}`);
              }
            }
            const actualFiles = [];
            const walk = (directory, prefix = "") => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const relative = prefix ? `${prefix}/${entry.name}` : entry.name;
                const absolute = path.join(directory, entry.name);
                if (entry.isSymbolicLink()) throw new Error(`runtime symlink is forbidden: ${relative}`);
                if (entry.isDirectory()) walk(absolute, relative);
                else if (entry.isFile()) actualFiles.push(relative);
                else throw new Error(`unsupported runtime entry: ${relative}`);
              }
            };
            walk(root);
            const expectedFiles = entries.map(([file]) => file).sort();
            const observedFiles = actualFiles.filter((file) => file !== "manifest.json").sort();
            if (JSON.stringify(observedFiles) !== JSON.stringify(expectedFiles)) {
              throw new Error("runtime manifest inventory mismatch");
            }
            for (const [file, expected] of entries) {
              const actual = crypto.createHash("sha256").update(fs.readFileSync(path.join(root, file))).digest("hex");
              if (actual !== expected) throw new Error(`digest mismatch: ${file}`);
            }
            console.log(JSON.stringify({ result: "EVALUATOR_READY", version: manifest.version, files: entries.length }));
          } catch (error) {
            console.error(JSON.stringify({ result: "EVALUATOR_UNAVAILABLE", error: error.message }));
            process.exit(2);
          }
          NODE

      - name: Run trusted Rapid/Lite report
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node trusted/.shirube/runtime/rapid-lite/run-rapid-lite-workflow.mjs \
            --target-dir target \
            --result-dir "$RESULT_DIR"
          cat "$RESULT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RESULT_DIR/aggregate.json"

      - name: Upsert PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const marker = "<!-- shirube-rapid-lite-gates-report/v1 -->";
            const summary = process.env.RESULT_DIR
              ? path.join(process.env.RESULT_DIR, "summary.md")
              : null;
            const body = summary && fs.existsSync(summary)
              ? fs.readFileSync(summary, "utf8")
              : `${marker}\n\n## Shirube Rapid/Lite Gates Report\n\nRuntime was unavailable before summary creation.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload Rapid/Lite gate JSON artifacts
        if: ${{ always() && env.RESULT_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shirube-rapid-lite-gates-${{ github.event.pull_request.number }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Enforce flow-safety activation
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          if (!process.env.RESULT_DIR) throw new Error("EVALUATOR_UNAVAILABLE: trusted result directory was not prepared");
          const reportPath = path.join(process.env.RESULT_DIR, "aggregate.json");
          if (!fs.existsSync(reportPath)) throw new Error("EVALUATOR_UNAVAILABLE: missing Rapid/Lite aggregate");
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const gate = report.gates?.find((entry) => entry.gate === "flow-safety");
          if (!gate) throw new Error("Missing flow-safety gate record.");
          if (gate.status === "ran" && gate.verdict !== "PASS") {
            throw new Error(`Flow-safety must PASS before audit handoff: ${gate.verdict}.`);
          }
          console.log(`Flow-safety activation: ${gate.status}/${gate.verdict}`);
          NODE

      - name: Enforce Rapid/Lite hard block
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          if (!process.env.RESULT_DIR) throw new Error("EVALUATOR_UNAVAILABLE: trusted result directory was not prepared");
          const reportPath = path.join(process.env.RESULT_DIR, "aggregate.json");
          if (!fs.existsSync(reportPath)) {
            throw new Error("EVALUATOR_UNAVAILABLE: missing Rapid/Lite aggregate");
          }
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          if (report.schema !== "shirube-rapid-lite-report/v1") {
            throw new Error(`EVALUATOR_UNAVAILABLE: unexpected aggregate schema ${String(report.schema)}`);
          }
          if (
            !["PASS", "PASS_WITH_WARN"].includes(report.verdict) ||
            report.report_failed !== false ||
            report.would_block !== false
          ) {
            throw new Error(
              `RAPID_LITE_HARD_BLOCK: verdict=${String(report.verdict)} report_failed=${String(report.report_failed)} would_block=${String(report.would_block)}`,
            );
          }
          const enforcement = report.gates?.find((entry) => entry.gate === "enforcement-policy");
          if (!enforcement || enforcement.status !== "ran") {
            throw new Error("EVALUATOR_UNAVAILABLE: enforcement-policy gate did not run");
          }
          if (
            !["PASS", "PASS_WITH_WARN"].includes(enforcement.verdict) ||
            enforcement.report_failed !== false ||
            enforcement.would_block !== false
          ) {
            throw new Error(
              `RAPID_LITE_ENFORCEMENT_BLOCK: verdict=${String(enforcement.verdict)} report_failed=${String(enforcement.report_failed)} would_block=${String(enforcement.would_block)}`,
            );
          }
          console.log(`Rapid/Lite hard block PASS: ${report.verdict}`);
          console.log("Required-check and branch-protection settings remain unchanged pending separate owner authorization.");
          NODE
