acceptance_criteria:
  - The shared agent_comms DB is the identity SSOT; registered and canonical IDs must match for new work, and every eligibility predicate must be verified true.
  - The 33 DB-primary plus 2 owner-approved secondary binding snapshot exactly equals the 35-target manifest and is bound into the rollout-plan authorization hash.
  - Manifest target keys and manifest SHA-256 are deterministic and unique.
  - All 35 workspace bindings resolve without persisting raw paths or secrets.
  - R0 records every config and native-trust preimage plus expected postimage without writing configuration or trust state.
  - Rollout tooling refuses any head, tree, artifact, config, binding, trust, backend, store-binding, workspace, or owner-decision mismatch.
  - Existing unrelated host hooks and settings are preserved byte-semantically.
  - Configuration writes are atomic and create mode-0600 rollback backups when a preimage exists.
  - R1, R2, and R3 advance only when the prior stage has 100% exact durable coverage and zero open P0/P1 alerts.
  - A read-only deployment observer records observed identity rather than copying expected identity.
  - The final OBS-05 snapshot has exact and durable coverage 100%, failed/drifted/not_observed 0, privacy violations 0, and open P0/P1 0.
  - No wrapper, TUI injection, tmux send-keys, automatic restart, bypass merge, force-push, secret access, or raw-path telemetry occurs.

