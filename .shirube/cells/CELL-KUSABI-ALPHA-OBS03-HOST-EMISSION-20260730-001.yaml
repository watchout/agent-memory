goal: >-
  Emit one strict privacy-safe session_start runtime event from each native
  Codex, Claude Code, and Gemini CLI adapter into the user-selected OBS-02
  SQLite or PostgreSQL ledger while preserving ordinary startup when the
  observability target or sink is absent, mismatched, slow, or unavailable.

acceptance:
  - With no rollout target binding, all three native adapters preserve their prior stdout and stderr behavior.
  - Host identities normalize exactly to codex, claude_code, and gemini_cli.
  - The canonical target_key is SHA-256 of agent_id, project, normalized host runtime, and workspace_sha256 joined by newlines.
  - The rollout target rejects unknown fields, JSON storage, malformed hashes, and non-exact build/configuration/storage identities.
  - A verified SQLite or PostgreSQL backend matching the target is required before durable ingest.
  - Same manifest, target, event type, and session reference produces a deterministic idempotent event_id.
  - Sink creation, backend drift, write failure, timeout, and emergency-writer failure never alter the already-produced hook result.
  - Emergency evidence is one bounded privacy-safe JSON line and excludes raw errors, paths, credentials, prompts, and recovery content.
  - The emission attempt is bounded to 500 ms after recovery unless a smaller deterministic test bound is injected.
  - Actual native CLI execution persists one schema-valid event for each of the three host runtimes.

