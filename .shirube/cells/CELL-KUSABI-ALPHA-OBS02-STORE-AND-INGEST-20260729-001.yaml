goal: >-
  Implement a privacy-safe, idempotent Kusabi runtime-event ingest boundary and
  dedicated durable ledger with equivalent normalized behavior in the
  user-selected SQLite and PostgreSQL stores, without mutating a live database
  or enabling any producer/runtime.

acceptance:
  - Strict draft-2020-12 validation rejects unknown fields before persistence.
  - Canonical recursive JSON hashing is deterministic.
  - Exact duplicate delivery is idempotent by event_id.
  - Same event_id with different canonical bytes is rejected as an integrity conflict.
  - SQLite acknowledges only after its selected file is written.
  - PostgreSQL acknowledges only after transaction commit.
  - Store failure produces bounded privacy-safe emergency evidence; dual failure is observable as failed.
  - JSON remains deterministic-fixture only and never counts as durable evidence.
  - Additive migrations are idempotent and do not rewrite the legacy raw_events ledger.
  - SQLite and PostgreSQL fixed fixtures produce an identical normalized SHA-256.
  - All database validation is isolated and cleaned up; no live product table is migrated.

