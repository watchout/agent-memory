goal: >-
  Freeze a complete, measurable, privacy-safe observability contract for the
  Kusabi alpha fleet before any latest-alpha fleet-wide activation. The design
  must make expected membership, observed build/configuration, recovery health,
  drift, missing evidence, and actionable failure feedback deterministically
  visible across Codex, Claude Code, and Gemini CLI without changing runtime,
  storage, agent configuration, or distribution in this cell.

