goal: >-
  Derive one schema-valid deterministic fleet status snapshot, bounded alerts,
  cross-host privacy-safe failure fingerprints, and a local human-readable
  report from one exact manifest and the OBS-02 runtime-event stream, with
  identical normalized results for SQLite and PostgreSQL and no notifier
  dependency.

acceptance:
  - State precedence is exact for not_observed, failed, drifted, stale, degraded, and healthy.
  - Snapshot counts equal unique manifest target rows and duplicate event delivery is idempotent.
  - Build, configuration, binding, and storage drift remain distinct deterministic reasons and alerts.
  - Open P0/P1 alerts are blocking; open P2/P3 alerts are non-blocking.
  - Evidence-sink failure is P2 before the durable-evidence deadline when emergency evidence exists and P1 at the deadline or on failed delivery.
  - Failure fingerprints group the same normalized defect across host runtimes without raw errors, paths, credentials, prompts, or recovery content.
  - Snapshot and alert IDs, ordering, counts, fingerprints, and reports are deterministic for the same manifest, events, and generated_at.
  - Optional notifier failure never changes or suppresses the canonical snapshot or local report.
  - SQLite and isolated PostgreSQL stores produce identical normalized status from the same event fixtures.
  - Status computation performs no schema migration, configuration, trust, runtime, host, or external-network mutation.

