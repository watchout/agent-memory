failure_modes:
  - id: FM-GRAPH-DRIFT
    detection: cell_or_dependency_not_in_graph_or_version_boundary_changes
    response: block_and_require_recorded_graph_amendment_and_fresh_audit
  - id: FM-INVENTORY-DRIFT
    detection: any_inventory_manifest_count_key_predicate_or_digest_mismatch
    response: block_before_owner_go_and_regenerate_r0_under_new_version
  - id: FM-CAPTURE-ABI-MISMATCH
    detection: capture_service_calls_a_store_capability_other_than_canonical_saveRawEvent
    response: stop_capture_candidate_and_require_tracked_contract_regression_evidence
  - id: FM-CAPTURE-REGISTRY-DRIFT
    detection: installed_capture_registry_keys_do_not_equal_authoritative_35_target_manifest
    response: >-
      block; categorize extras and missing keys by read-only evidence; never
      silently adopt, delete, or redefine the authoritative denominator
  - id: FM-MUTABLE-RUNTIME-PROVENANCE
    detection: startup_or_capture_runtime_resolves_to_mutable_workspace_dist
    response: block_production_go_until_exact_commit_tree_and_artifact_digest_readback
  - id: FM-GEMINI-CAPTURE-UNSUPPORTED
    detection: supported_gemini_visible_event_adapter_cannot_meet_privacy_and_continuity_contract
    response: >-
      fail closed and require OD-OBS05-GEMINI-CAPTURE-UNSUPPORTED-DISPOSITION;
      do not silently exclude Gemini or reduce the three-host acceptance scope
  - id: FM-AMBIGUOUS-INTERRUPTION-REPLAY
    detection: interrupted_external_effect_has_no_idempotency_key_or_external_readback
    response: block_automatic_retry_and_require_external_state_reconciliation
  - id: FM-PRIVATE-OR-PROTECTED-CAPTURE
    detection: private_reasoning_system_or_developer_instruction_body_is_captured
    response: stop_candidate_zero_production_effects_record_incident_and_reverify_redaction
  - id: FM-STALE-AUDIT
    detection: audited_head_tree_or_artifact_digest_differs_from_current_subject
    response: reject_verdict_as_superseded_and_route_one_current_exact_subject
  - id: FM-PROTECTED-EFFECT-WITHOUT-GO
    detection: configuration_trust_distribution_activation_or_merge_before_exact_owner_go
    response: stop_zero_further_effects_record_incident_and_require_owner_disposition
  - id: FM-STAGE-BLOCKER
    detection: first_p0_p1_or_exact_identity_durable_evidence_privacy_or_parity_failure
    response: stop_affected_stage_freeze_evidence_and_use_target_local_frozen_rollback
  - id: FM-SOAK-GAP
    detection: missing_checkpoint_or_threshold_failure_inside_continuous_window
    response: reset_24_hour_window_after_resolution_and_new_required_authority
  - id: FM-FALSE-CLOSURE
    detection: ci_merge_queue_ack_or_deploy_receipt_used_as_completion
    response: keep_cell_open_until_exact_required_evidence_and_owner_closure

