acceptance_criteria:
  - All six fleet states follow the fixed precedence in the OBS-04 design contract.
  - All fixed P0-P3 conditions map to deterministic alerts and Shirube next actions.
  - The evidence-sink deadline escalates from P2 to blocking P1 without suppressing local evidence.
  - Fingerprints group the same normalized defect across hosts without forbidden raw content.
  - Duplicate delivery, unknown targets, malformed records, and bounded-history truncation fail closed.
  - SQLite and isolated PostgreSQL fixtures produce the same normalized fleet-status digest.
  - Notifier failure cannot alter or suppress the canonical snapshot or local report.
  - Full TypeScript, repository, native-hook, build, path-scope, privacy, and diff checks pass.

