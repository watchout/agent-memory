phase_a_allowed_operations:
  - read-only authoritative inventory and existing configuration inspection
  - create and edit only allowed_paths
  - implement deterministic manifest, rollout-plan, R0, stage-gate, and observed-deployment evidence tooling
  - bind emitted storage identity to the credential-safe hash of the actual resolved hook store rather than copying the manifest target
  - use existing native host installers through their exported atomic APIs in tests and dry-run only
  - run local schema, TypeScript, unit, full regression, SQLite, isolated PostgreSQL, build, privacy, path-scope, and diff checks
  - create temporary test-only workspaces, files, SQLite databases, and isolated PostgreSQL schemas with deterministic cleanup
  - commit and push the implementation branch without force
  - create and update one draft pull request targeting main
  - route the two required independent audits through AUN
  - generate credential-safe local R0 and manifest candidate artifacts without raw paths or environment values

phase_a_forbidden_operations:
  - write any production agent configuration or trust state
  - activate, distribute, deploy, restart, stop, launch, or inject any production agent/session
  - write live Kusabi runtime events or change live SQLite/PostgreSQL state
  - external notification other than durable control/audit routing for this cell
  - wrapper use, TUI input, tmux send-keys, clipboard writes, or automatic restart
  - maker self-audit, self-approval, self-merge, bypass, force-push, npm publish, tag, or release
  - access or persist credentials, database URLs, environment values, raw absolute paths, prompts, conversations, recovery content, private reasoning, exceptions, or stacks as telemetry

phase_b_protected_operations:
  authorization_state: PENDING_EXACT_MANIFEST_OWNER_GO
  allowed_only_after:
    - PR 277 merged exact-head verification
    - pre-implementation R4 audit PASS with zero blocking findings
    - final implementation head/tree and host artifact hashes frozen
    - 35-target manifest and rollout-plan hashes frozen
    - R0 35/35 PASS with rollback preimages and expected postimages
    - exact owner decision binding implementation head/tree, manifest hash, rollout-plan hash, and artifact/config/binding/backend tuple
  proposed_operations:
    - atomically apply only the managed Kusabi hook definition for manifest targets in R1, R2, then R3 order
    - preserve unrelated settings and create mode-0600 preimage backups
    - perform read-only post-write byte/hash verification and emit observed deployment evidence
    - request normal native host trust/review through explicit operator actions without TUI injection or automatic restart
    - rollback the affected stage only when a frozen stop condition fires

stop_conditions:
  - PR 277 merges a head or tree other than the approved exact tuple
  - the canonical eligible selector or approved Kusabi three-host binding produces a denominator other than the frozen 35 targets
  - any workspace, runtime, project, target key, preimage, expected postimage, artifact, trust, backend, store binding, or owner-decision ref is unresolved or mismatched
  - a config path or runtime artifact is a symlink or non-regular file
  - a write would touch anything except the one managed host definition and its installer backup
  - any required audit returns a blocking finding
  - a stage produces an open P0/P1, privacy violation, failed/drifted/not_observed target, or non-durable evidence at its deadline
  - protected mutation is attempted before the exact manifest owner GO
  - merge or deployment would require bypass or scope expansion

