design_rule_exceptions:
  - rule_id: DR-DATA-001
    scope:
      - src/test.ts
    reason: >-
      The hard-delete patterns this rule matches are pre-existing content of src/test.ts, a
      4,800-line suite that already exercises deletion paths. This cell adds fixtures to that
      file and introduces no delete operation. Verified by re-running the same gate with only
      the new file in scope, which returns zero blockers, isolating the finding to the legacy
      file. Same finding and same attribution as CH-S1A-CONTEXT-WINDOW-RESOLUTION.
    approved_by: kusabi/implementation_executor
    expires_at: "2026-09-30"
  - rule_id: DR-CODE-001
    scope:
      - src/test.ts
    reason: >-
      Pre-existing duplication in the legacy suite, reproduced on unmodified main during the
      S1-A cell and unchanged by this one. Recorded for completeness; note that
      evaluateDuplicateRule does not consult design_rule_exceptions, so this declaration
      cannot clear the finding and the blocker persists until the owner rules on the landing
      option raised in PR 314.
    approved_by: kusabi/implementation_executor
    expires_at: "2026-09-30"
design_rule_notes:
  - rule_id: DR-ARCH-001
    scope:
      - src/codex-context-measurement.ts
    severity: WARN
    response: >-
      No domain shape is carried in this source file. The context window is read from the
      transcript at runtime rather than declared anywhere, which is the specific defect this
      cell exists to avoid: a model table would have recorded two entries for gpt-5.6-sol and
      gpt-5.5 and both would have been wrong, because the observed 258,400 window is imposed
      by the Codex CLI rather than by the model.

