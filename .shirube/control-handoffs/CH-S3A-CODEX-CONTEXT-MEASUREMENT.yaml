cell:
  CELL-ID: S3A-CODEX-CONTEXT-MEASUREMENT
  cell_type: capability_addition
  risk_class: R1
  goal: Give the codex host a correct context measurement and denominator, so its seats stop being unmeasurable, without registering or changing any hook.
  non_scope:
    - registering, editing or rebuilding any Stop hook or its dist; that is stage S3b and is owner-gated
    - writing context-health records; this cell extracts and returns a value
    - the gemini adapter, which is blocked on THR-OPEN-5
    - restart_events and any other schema change; that is OG-CTXR-01 and remains gated
    - package.json, .github/workflows and every host config file
  test_coupling_exempt: false
  acceptance_criteria:
    - src/codex-context-measurement.ts reads the current context size from the last token_count record's last_token_usage.input_tokens and never from total_token_usage.
    - cached_input_tokens is never added to the input count, because on this host it is a subset of it rather than a separate bucket as on claude.
    - The context window is taken from the host-reported model_context_window and is labelled window_source host_reported, so no model table entry is consulted.
    - The last token_count record wins, so a compacted session reports its post-compaction context rather than a size that no longer exists.
    - A malformed or partially written final line is skipped rather than discarding the records already read.
    - The model is read from the structured turn_context model field, never from a substring of the transcript.
    - Every unmeasured path names its reason - no_token_count_record, usage_field_missing or window_missing - and invents no context size.
    - A measurement above the window is reported unchanged; declining or clamping belongs to the judgment layer.
    - Fixtures CTX-01 through CTX-10 run inside src/test.ts, which the CI core-test step already executes.
    - No file outside src/ and this cell's Shirube control artifacts is changed.
  allowed_paths:
    - src/**
    - .shirube/control-handoffs/**
    - .shirube/control-handoffs/CH-S3A-CODEX-CONTEXT-MEASUREMENT.yaml
  forbidden_paths:
    - scripts/shirube/**
    - db/**
    - migrations/**
    - package.json
    - package-lock.json
    - .env*
    - deploy/**
    - .github/workflows/**
    - dist/**
  protected_surfaces:
    declared:
      - runtime code
      - database
      - migrations
      - secrets
      - active workflows
      - required checks
      - branch protection
      - production
    touched: true
    touched_detail: >-
      runtime code only. src/codex-context-measurement.ts is new and pure; src/test.ts gains
      an import, a test function and one call. No hook, database, migration, workflow,
      package or deploy surface is touched, and no dist is rebuilt.
  stop_conditions:
    - changed file outside allowed_paths
    - forbidden path touched
    - a hook registration or dist rebuild becomes necessary to land the extraction
    - a restart is executed by any code path in this cell
    - exact-head owner decision missing before merge
implementation_boundary:
