    - .claude/**
    - .codex/**
    - .cursor/**
    - .gemini/**
    - .github/**
    - .shirube/audit-item-sets/**
    - .shirube/cells/**
    - .shirube/gate-contracts/**
    - .shirube/reports/**
    - .shirube/repo-spec.yaml
    - db/**
    - dist/**
    - package-lock.json
    - deploy/**
    - secrets/**
    - .env
    - .env.*
  stop_conditions:
    - exact base/tree or clean isolated-worktree preflight mismatch
    - required behavior needs a path outside allowed_paths
    - any frozen host, P0, timing, score, RI0, S15, fallback, or claim predicate changes
    - a stored-value echo/squelch fixture can pass without a task action receipt and new useful-result evidence
    - S15 is not evaluated first or its failure does not stop all downstream scoring
    - missing timing, identity, delivery, provenance, or safety evidence can fail open
    - any focused test, build, full test, schema validation, diff-check, or path-subset check fails
    - any live target config, trust, TUI, queue, process, restart, activation, canary, or rollout effect occurs

acceptance_criteria:
  - The scenario inventory is exactly S1 through S15 with S15 implemented as a canonical negative evaluator fixture.
  - S15 executes before score admission and its failure returns a stopped result with no downstream scenario results.
  - Stored expected values, objective repetition, or output equality cannot substitute for a task-relevant action receipt and newly produced useful-result evidence.
  - Counted recovery scenarios require ordinary native command, first-context delivery, verified identity, RI0, restatement zero, T1 at most 10s, T3 at most 30s, T4 at most 60s, score at least 28/30, blind operator at least 4.5/5, and zero automatic failures.
  - S13 explicitly verifies visible degraded bare-host usability for untrusted, disabled, or failed hooks without claiming successful recovery delivery.
  - S14 covers exactly Codex, Claude Code, and Gemini CLI with no wrapper or community-host substitution.
  - The P0 aggregate preserves exactly kusabi, spec, arc, codex-cto, codex-audit, devauditor, qa, check, org-build-dev, and dev-001 in order.
  - Scenario-specific predicates cover sudden-death RPO, compaction, long gap, overflow/missing context, active-task selection, SSOT correction, dirty worktree/test recovery, restart-generation degradation, isolation, and multi-hop contamination blocking.
  - Deterministic fixture output can verify the harness but can never claim live continuity-alpha acceptance.
  - Output is schema-shaped, reason-coded, and records zero protected effects.

validation:
  required_commands:
    - npm run build
    - npm run test:continuity-alpha-evaluator
    - npm test
    - git diff --check
    - changed-path subset check against cell.allowed_paths
  required_evidence:
    - exact base, head, tree, ordered parents, branch, and clean isolated worktree
    - exact changed-path list and allowed-path subset result
    - positive scenario inventory and negative fixture inventory
    - S15 false-pass rejection and no-downstream-scoring receipt
    - JSON Schema validation receipt for pass and stopped outputs
    - zero live launch, TUI, queue, restart, activation, canary, and rollout effects
    - Draft PR URL and remote exact-head readback
    - independent exact-head audit PASS or PASS_WITH_WARN

