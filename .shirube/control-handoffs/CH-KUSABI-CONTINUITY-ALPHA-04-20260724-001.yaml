    ALPHA-00 fixes the native alpha host gate to exactly Codex, Claude Code,
    and Gemini CLI. Cursor remains later-tier despite the frozen graph table's
    legacy host-4 wording.
  non_scope:
    - live host launch, session termination, activation, canary, or rollout
    - ALPHA-01, ALPHA-02, ALPHA-03, or ALPHA-05 through ALPHA-07 implementation
    - hook, config, trust, profile, identity, DB, migration, deploy, or queue mutation
    - disconnect detection, automatic restart, process kill, or running-session injection
    - TUI write, tmux send-keys, or clipboard write
    - self-audit, self-approval, Ready, merge, release, or public alpha claim
  allowed_paths:
    - .shirube/control-handoffs/CH-KUSABI-CONTINUITY-ALPHA-04-20260724-001.yaml
    - src/continuity-alpha-evaluator.ts
    - src/test-continuity-alpha-evaluator.ts
    - docs/design/schemas/continuity-alpha-evaluation-v1.schema.json
    - docs/operations/RECOVERY_EVALUATION.md
    - docs/v2/KUSABI_V2_RECOVERY_SCORE_CONTRACT.md
    - package.json
  forbidden_paths:
