cell:
  CELL-ID: CELL-KUSABI-250-TEST-ISOLATION-20260921-001
  cell_type: implementation
  risk_class: R2
  goal: Core tests use only fresh isolated JSON directories and never the shared home store.
  allowed_paths:
    - src/test.ts
    - .shirube/control-handoffs/CH-KUSABI-250-TEST-ISOLATION-20260921-001.yaml
  forbidden_paths:
    - .github/workflows/**
    - package.json
    - package-lock.json
    - src/stores/**
  acceptance_criteria:
    - No KUSABI_TEST_TMPDIR or RUNNER_TEMP means failure before any test or store operation.
    - Every invocation creates a fresh child below the supplied existing parent. Every core JsonStore receives that explicit child path.
    - Home, shared-memory, relative and blank roots are rejected. Cleanup removes only the newly owned child and its fixtures.
    - The existing GitHub Actions RUNNER_TEMP environment provides the CI parent; workflow and product default-store behavior stay unchanged.
    - A new independent PR is open with required CI 3/3 green and before/after shared-home directory metadata evidence in its body.
  stop_conditions:
    - A test process attempts shared-home content access or mutation.
    - The metadata invariant remains unproven; report that unmet predicate without excluding changing entries or claiming completion.
    - Any implementation path outside the allowlist is required.
implementation_boundary:
  summary: Test entry guard, explicit JsonStore fixture paths, bounded cleanup and isolation regression cases only.
  forbidden_operations:
    - Shared home file-content access, write, delete, move or restore.
    - Database server, live runtime, credential or queue operations.
    - Push changes to PR314 or PR315 before this isolation cell is merged.
    - Maker approval or merge.
validation:
  required_commands:
    - Typecheck with no emit.
    - Guard probes without a supplied root and with unsafe roots; all must exit before tests.
    - Core suite with a fresh explicit KUSABI_TEST_TMPDIR; OS sandbox denies shared-home reads and writes.
    - Shared-home immediate directory listing and lstat metadata before/after; no file contents.
    - Required Node18/20/22 CI jobs on the exact PR head.
  observation_boundary: The cell explicitly requires listing/mtime observations. This admits metadata only, not shared file content access or restore.
  required_evidence:
    - exact_head_sha
    - CI_run_URL
    - shared_directory_metadata_before_after
    - guard_and_core_test_results
next_action:
  owner_agent: suite-lead
  active_function: orchestration_controller
  action: Attach needs:audit and route the exact isolation PR to the independent auditor, then arrange merge; only after merge resume the preserved PR314/315 corrections.
