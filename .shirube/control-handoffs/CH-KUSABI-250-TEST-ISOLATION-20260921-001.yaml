cell:
  CELL-ID: CELL-KUSABI-250-TEST-ISOLATION-20260921-001
  cell_type: implementation
  risk_class: R2
  goal: Core tests use only fresh isolated JSON directories and never the shared home store.
  allowed_paths:
    - src/test.ts
    - .shirube/control-handoffs/CH-KUSABI-250-TEST-ISOLATION-20260921-001.yaml
  forbidden_paths:
    - .github/workflows/**
    - package.json
    - package-lock.json
    - src/stores/**
  acceptance_criteria:
    - No KUSABI_TEST_TMPDIR or RUNNER_TEMP means failure before any test or store operation.
    - Every invocation creates a fresh child below the supplied existing parent. Every core JsonStore receives that explicit child path.
    - Home, shared-memory, relative and blank roots are rejected. Cleanup removes only the newly owned child and its fixtures.
    - Reject home and shared-store aliases by dev/ino, and reject store descendants by checking every ancestor identity. String checks are supplementary.
    - Canonical, volume-alias, case-alias and symlink negative fixtures cover both environment inputs before directory creation.
    - The full core suite passes under an OS sandbox that denies writes to the shared store.
    - Without a sandbox, compare the complete shared-home listing and metadata before/after the suite. Test-created, modified or deleted files must total zero. Identify the writer of every changed item; unattributed changes remain unmet.
    - The existing GitHub Actions RUNNER_TEMP environment provides the CI parent; workflow and product default-store behavior stay unchanged.
    - A new independent PR is open with required CI 3/3 green and before/after shared-home directory metadata evidence in its body.
  stop_conditions:
    - A test process attempts shared-home content access or mutation.
    - A changed shared-home item cannot be attributed to an identified non-test writer; report the unmet predicate without excluding that item or claiming completion.
    - Any implementation path outside the allowlist is required.
implementation_boundary:
  summary: Test entry guard, explicit JsonStore fixture paths, bounded cleanup and isolation regression cases only.
  forbidden_operations:
    - Shared home file-content access, write, delete, move or restore.
    - Database server, live runtime, credential or queue operations.
    - Push changes to PR314 or PR315 before this isolation cell is merged.
    - Maker approval or merge.
validation:
  required_commands:
    - Project typecheck with no emit; report its test-entrypoint exclusion and any separate targeted diagnostics accurately.
    - Guard probes without a supplied root and with unsafe roots; all must exit before tests.
    - Real filesystem canonical, volume and case alias probes with a non-writing mkdtemp tripwire; both environment inputs.
    - Core suite with a fresh explicit KUSABI_TEST_TMPDIR; OS sandbox denies shared-home writes and content reads while allowing identity metadata.
    - Core suite without sandbox, with a fresh explicit KUSABI_TEST_TMPDIR; shared-home complete immediate listing and lstat metadata before/after, with live writer attribution for changes.
    - Required Node18/20/22 CI jobs on the exact PR head.
  observation_boundary: The amendment admits directory identity/listing/mtime and read-only writer-process observations (launchctl, lsof or equivalent). No shared file contents, process control or restore.
  required_evidence:
    - exact_head_sha
    - CI_run_URL
    - shared_directory_metadata_before_after
    - guard_and_core_test_results
