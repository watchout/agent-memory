acceptance_criteria:
  - The fleet target denominator is frozen by a versioned manifest before rollout; registry totals are never treated as the denominator implicitly.
  - Runtime events and derived fleet status have strict draft-2020-12 JSON Schemas with unknown fields rejected.
  - Expected and observed commit, tree, artifact, configuration, binding, host runtime, and storage-backend identities are comparable without secrets.
  - Healthy, degraded, failed, stale, not_observed, and drifted states are deterministic.
  - Missing evidence, version drift, configuration drift, repeated degradation, runtime failure, and privacy-policy violation have explicit alert rules.
  - Every fixed alert code has one schema-enforced severity; open or acknowledged P0/P1 alerts are blocking, P2/P3 alerts are non-blocking, and evidence_sink_failure has an explicit P1-failed-or-deadline versus P2-emergency-before-deadline split.
  - SQLite and PostgreSQL preserve one product contract; centralized internal fleet observation does not make AUN a Kusabi core dependency.
  - Conversation content, prompts, private reasoning, recovery-pack content, credentials, database URLs, environment values, and raw absolute paths are forbidden telemetry.
  - The rollout runbook has canary, staged rollout, rollback, alert smoke, 24-hour soak, and exact closure criteria.
  - Runtime implementation, DB migration, configuration mutation, trust changes, activation, and fleet distribution remain outside this cell.

