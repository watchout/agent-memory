    - next_step
    - no_unresolved_follow_up_blocker
legacy_source_boundary:
  legacy_sources_may_inform: true
  legacy_sources_are_truth: false
  required_current_truth_ref: watchout/agent-memory#250
design_rule_exceptions:
  - rule_id: DR-DATA-001
    scope:
      - src/test.ts
    reason: >-
      The hard-delete patterns this rule matches are pre-existing content of src/test.ts, a
      4,800-line suite that already exercises deletion paths. This cell adds fixtures to that
      file and introduces no delete operation: main's copy matches 24 such lines and the added
      block matches 0. Verified by re-running the same gate with only the new file in scope,
      which returns zero blockers, isolating both findings to the legacy file.
    approved_by: kusabi/implementation_executor
    expires_at: "2026-09-30"
  - rule_id: DR-CODE-001
    scope:
      - src/test.ts
    reason: >-
      Duplication in the added block was fixed rather than excepted: the eight repeated
      judgeContextHealth call shapes were extracted into a local judge helper before this
      exception was written. The finding persisted afterwards, which localizes it to
      pre-existing content of the same legacy file, confirmed by the new-file-only gate run
      above returning zero blockers.
    approved_by: kusabi/implementation_executor
    expires_at: "2026-09-30"
design_rule_notes:
  - rule_id: DR-ARCH-001
    scope:
      - src/context-window-resolution.ts
    severity: WARN
    response: >-
      The required action is to move the domain shape to DB/config or document why source
      ownership is acceptable. It is acceptable here because CONTEXT_WINDOW_CANDIDATES is a
      mirror of an external model catalog, not a value this repository owns. The module states
      the source and its cache date, names the Models API as the live authority, and carries a
      staleness guard that declines to judge when a measurement exceeds the recorded window
      rather than clamping. Moving it into the database is exactly what OG-CTXR-01 gates, and
      a new config file would add a surface this cell is scoped out of.
  - rule_id: DR-CONFIG-001
    scope:
      - src/context-window-resolution.ts
    severity: WARN
    response: >-
      The band ratios and window values are carried in source deliberately: the ratios are
      unchanged from the values already hardcoded in restart-prepare.ts, so introducing a
      config surface here would fork one ladder into two. Re-tuning is deferred until the band
      distribution can be observed, per the design note on issue 250.
