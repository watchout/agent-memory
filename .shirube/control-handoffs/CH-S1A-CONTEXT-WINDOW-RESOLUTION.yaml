cell:
  CELL-ID: S1A-CONTEXT-WINDOW-RESOLUTION
  cell_type: defect_repair
  risk_class: R2
  goal: Give the context-threshold chain a working denominator so band stops being unknown, without touching storage or restarting anything.
  non_scope:
    - restart_events and any other schema change; that is OG-CTXR-01 and remains gated
    - writing evidence rows; the judgment is pure and returns a value
    - rewiring the SessionStart hook or rebuilding any dist
    - the supervisor and actual restart execution, which are stage S2
    - package.json, .github/workflows and every host config file
  test_coupling_exempt: false
  acceptance_criteria:
    - src/context-window-resolution.ts resolves a context window in the order env override, marker, model table, and returns exactly one window or an unresolved verdict.
    - The band ladder keeps the current ratios and separates ok from unknown, so a healthy session is distinguishable from one that could not be judged.
    - A model id is taken from the structured model field of transcript records, never from a substring search, and a dated id normalizes to its catalog alias.
    - Every unresolved path names its reason - model_unresolved, context_window_unresolved, context_window_ambiguous, window_table_stale or measured_exceeds_window - and leaves restart_required false.
    - A measurement above the resolved window declines to judge rather than clamping the ratio to 1 and reporting require.
    - Fixtures THR-01 through THR-13 run inside src/test.ts, which the CI core-test step already executes, so the checks are a gate rather than a file nothing runs.
    - No file outside src/ and this cell's Shirube control artifacts is changed.
  allowed_paths:
    - src/context-window-resolution.ts
    - src/test.ts
    - .shirube/control-handoffs/**
    - .shirube/control-handoffs/CH-S1A-CONTEXT-WINDOW-RESOLUTION.yaml
  forbidden_paths:
    - scripts/shirube/**
    - db/**
    - migrations/**
    - package.json
    - package-lock.json
    - .env*
    - deploy/**
    - .github/workflows/**
    - dist/**
  protected_surfaces:
    declared:
      - runtime code
      - database
      - migrations
      - secrets
      - active workflows
      - required checks
      - branch protection
      - production
    touched: true
    touched_detail: >-
      runtime code only. src/context-window-resolution.ts is new and pure; src/test.ts gains
      an import, a test function and one call. No database, migration, workflow, package or
      deploy surface is touched.
  stop_conditions:
    - changed file outside allowed_paths
    - forbidden path touched
    - a schema or migration change becomes necessary to land the judgment
    - a restart is executed by any code path in this cell
    - exact-head owner decision missing before merge
