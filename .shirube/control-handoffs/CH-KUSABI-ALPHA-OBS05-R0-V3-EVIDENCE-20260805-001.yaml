failure_modes:
  - id: FM-EVIDENCE-DRIFT
    detection: Either predecessor file or embedded payload digest differs.
    recovery: Reject the candidate head and restore the byte-identical predecessor evidence before any audit request.
  - id: FM-PATH-EXPANSION
    detection: Base-to-head diff contains a path outside allowed_paths or a mode/rename delta.
    recovery: Do not push or audit; remove the unauthorized candidate delta and rerun exact path equality.
  - id: FM-EXACT-HEAD-DRIFT
    detection: PR API head/tree differs from the audit or owner-decision subject.
    recovery: Supersede the stale record and request a fresh independent audit and owner decision for the current exact subject.
  - id: FM-GATE-INPUT-MISSING
    detection: Rapid/Lite cannot discover this handoff, validation evidence, audit record, or owner decision.
    recovery: Correct only the missing PR-visible control input without bypass and rerun the hard gate.
  - id: FM-PARTIAL-PUBLICATION
    detection: Local commit, remote branch, PR API head, or hosted check references differ.
    recovery: Stop before owner approval and reconcile all four refs to one exact head/tree.
  - id: FM-CORRELATED-ERROR
    detection: Author evidence is not independently reproduced by a registered audit seat.
    recovery: Fail closed and require an independent evidence_audit_gate PASS with zero blockers.

