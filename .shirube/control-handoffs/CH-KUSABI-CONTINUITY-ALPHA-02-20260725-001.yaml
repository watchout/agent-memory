cell:
  CELL-ID: ALPHA-02
  cell_type: runtime_adapter
  risk_class: R2
  exact_base_sha: 6f594b617424130e383c637e67575204b7d6e86f
  exact_base_tree: 92965eebbe94a656a08fdcb3a3aa74fd63da5e4b
  goal: >-
    Make ordinary Claude Code SessionStart source behavior conform to the
    frozen Host Adapter Contract before later live placement and canary.
  non_scope:
    - live Claude settings placement, trust mutation, activation, canary, rollout, or deployment
    - disconnect detection, automatic restart, process kill, or running-session injection
    - TUI write, tmux send-keys, clipboard write, or AUN queue lifecycle mutation
    - database schema, workflow, secret, Ready, merge, or release mutation
    - self-audit, self-approval, or graph expansion
  allowed_paths:
    - .shirube/control-handoffs/CH-KUSABI-CONTINUITY-ALPHA-02-20260725-001.yaml
    - src/claude-session-start.ts
    - src/test-claude-session-start.ts
    - src/claude-start.ts
    - docs/design/schemas/claude-session-start-evidence-v1.schema.json
    - docs/operations/HOST_ADAPTERS.md
    - docs/operations/RECOVERY_EVALUATION.md
    - package.json
  forbidden_paths:
    - .claude/**
    - .codex/**
    - .gemini/**
    - .github/**
    - db/**
    - dist/**
    - package-lock.json
    - deploy/**
    - secrets/**
    - .env
    - .env.*
  stop_conditions:
    - exact base/tree or clean isolated-worktree preflight mismatch
    - required behavior needs a path outside allowed_paths
    - native Claude hook behavior contradicts the bounded contract
    - ordinary Claude startup cannot remain usable on hook failure
    - agent_id, project, and workspace identity cannot be verified without ambiguity
    - any focused test, build, full test, schema, cap, redaction, timeout, or path check fails
    - any live config, trust, TUI, queue, restart, or running-session effect occurs

acceptance_criteria:
  - The ordinary launch command remains exactly claude and the native config surface is .claude/settings.json.
  - SessionStart accepts startup, resume, clear, and compact and rejects malformed or unsupported inputs safely.
  - Stdout is exactly one strict JSON object with bounded hookSpecificOutput.additionalContext on success.
  - Identity binds explicit agent_id, project, and workspace and verifies hook cwd inside that workspace.
  - Recovery output is redacted and records numeric byte/token caps, redaction count, truncation count, and omitted-section count.
  - Internal deadline is at most 7000ms and generated hook timeout is 9 seconds.
  - Recovery and evidence failures leave ordinary startup usable and visibly degraded.
  - Source-side evidence keeps T0-T4 and first-context confirmation null/false.
  - ALPHA-02 performs no live placement, activation, canary, restart, TUI write, or AUN queue lifecycle mutation.

validation:
  required_commands:
    - npm ci
    - npm run build
    - npx tsx src/test-claude-session-start.ts
    - npm test
    - git diff --check
    - changed-path subset check against cell.allowed_paths
    - npm pack --dry-run --json
  required_evidence:
    - exact base, head, tree, ordered parents, branch, and clean isolated worktree
    - exact changed-path list and allowed-path subset result
    - command-by-command validation output
    - fail-safe, identity, redaction, cap, timeout, evidence degradation, and zero-effect fixtures
    - Draft PR URL and exact remote-head readback
    - independent exact-head evidence_audit_gate PASS or PASS_WITH_WARN
    - zero live Claude config, trust, activation, TUI, queue, restart, and canary effects

next_action:
  who: kusabi
  active_function: implementation_executor
  what: implement and validate ALPHA-02 only, then open one Draft PR and route its exact head to one independent evidence audit
  how: use the isolated exact-base worktree and preserve the exact allowed-path subset
  exact_input_refs:
    - https://github.com/watchout/agent-memory/issues/180#issuecomment-5053368043
    - https://github.com/watchout/agent-memory/issues/180#issuecomment-5066220025
    - https://github.com/watchout/agent-memory/issues/180#issuecomment-5075907164
    - https://code.claude.com/docs/en/hooks
  scope: ALPHA-02 source parity hardening only
  deliverable: validated Draft PR, exact implementation evidence, and independent audit request
  completion_evidence: exact tuple, path-subset PASS, validation results, Draft PR, and audit queue/message ids
  blocking: false
